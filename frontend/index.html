<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Krishi Bazar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
        :root {
            --bg: #f6f8f3;
            --card: #fff;
            --tx: #1d2a1f;
            --mu: #667568;
            --pr: #2f7d32;
            --pr2: #e3f1e2;
            --bd: #dde4d9;
            --wr: #b26a00
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --bg: #121a14;
                --card: #1b261d;
                --tx: #e7efe8;
                --mu: #97a89a;
                --pr: #6fcf74;
                --pr2: #23382a;
                --bd: #2b3b2e;
                --wr: #f0b45a
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.45 system-ui, Segoe UI, Roboto, sans-serif
        }

        header {
            background: var(--pr);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        header h1 {
            font-size: 18px;
            margin: 0
        }

        #badge {
            padding: 6px 16px;
            font-size: 13px;
            background: var(--pr2);
            color: var(--pr)
        }

        #badge.w {
            background: var(--wr);
            color: #fff
        }

        nav {
            display: flex;
            gap: 4px;
            padding: 8px;
            overflow-x: auto;
            background: var(--card);
            border-bottom: 1px solid var(--bd);
            position: sticky;
            top: 0;
            z-index: 5
        }

        nav button {
            border: 0;
            background: none;
            color: var(--mu);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap
        }

        nav button.on {
            background: var(--pr2);
            color: var(--pr);
            font-weight: 600
        }

        main {
            max-width: 980px;
            margin: 0 auto;
            padding: 14px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px
        }

        h2 {
            font-size: 17px;
            margin: 0 0 10px
        }

        h3 {
            font-size: 15px;
            margin: 0 0 4px
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--mu);
            margin: 8px 0 3px
        }

        input,
        select {
            width: 100%;
            padding: 9px;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--bg);
            color: var(--tx);
            font-size: 15px
        }

        .b {
            background: var(--pr);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            margin: 8px 4px 0 0
        }

        .b.s {
            background: var(--pr2);
            color: var(--pr)
        }

        .mu {
            color: var(--mu);
            font-size: 13px
        }

        .tag {
            background: var(--pr2);
            color: var(--pr);
            border-radius: 10px;
            padding: 2px 8px;
            font-size: 12px
        }

        .big {
            font-size: 22px;
            font-weight: 700;
            color: var(--pr)
        }

        .up {
            color: var(--pr);
            font-weight: 600
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 12px
        }

        .tw {
            overflow-x: auto
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 560px
        }

        th,
        td {
            text-align: left;
            padding: 7px;
            border-bottom: 1px solid var(--bd);
            font-size: 13px
        }

        .steps {
            display: flex;
            gap: 4px;
            margin: 8px 0
        }

        .steps i {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: var(--bd)
        }

        .steps i.d {
            background: var(--pr)
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .row>* {
            flex: 1;
            min-width: 130px
        }

        #toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 16px;
            background: var(--tx);
            color: var(--bg);
            padding: 10px 16px;
            border-radius: 20px;
            display: none;
            z-index: 9;
            max-width: 90%
        }

        .sb {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            z-index: 20;
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 8px;
            max-height: 240px;
            overflow-y: auto;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .15)
        }

        .sb div {
            padding: 9px 12px;
            cursor: pointer;
            font-size: 14px
        }

        .sb div:hover {
            background: var(--pr2)
        }

        .pl {
            background: linear-gradient(135deg, #0f2027, #1f4e5f 60%, #2a7f62);
            color: #fff;
            border-radius: 18px;
            padding: 26px;
            margin-bottom: 16px
        }

        .pl h1 {
            margin: 0 0 6px;
            font-size: 26px
        }

        .pl p {
            margin: 0;
            opacity: .9
        }

        .lg2 {
            display: inline-block;
            background: #fff;
            color: #0f5132;
            border-radius: 6px;
            padding: 2px 10px;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: .8px;
            margin-bottom: 10px
        }

        .bn {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 10px;
            margin-bottom: 12px
        }

        .bn>div {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 12px
        }

        .bn>div>span {
            font-size: 22px
        }

        .bn b {
            display: block;
            font-size: 14px
        }

        .pc {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin: 14px 0
        }

        .pp {
            position: relative;
            background: var(--card);
            border: 2px solid var(--bd);
            border-radius: 16px;
            padding: 22px 16px 16px;
            cursor: pointer;
            transition: border-color .15s, box-shadow .15s
        }

        .pp:hover {
            border-color: var(--pr)
        }

        .pp.on {
            border-color: var(--pr);
            box-shadow: 0 0 0 3px rgba(34, 160, 90, .25)
        }

        .pp .rd {
            position: absolute;
            right: 14px;
            top: 18px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--bd)
        }

        .pp.on .rd {
            border: 6px solid var(--pr)
        }

        .pp .tg {
            position: absolute;
            left: 14px;
            top: -11px;
            background: #f59e0b;
            color: #1a1a1a;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 99px
        }

        .pp .pr {
            font-size: 30px;
            font-weight: 800
        }

        .pp .pr small {
            font-size: 14px;
            font-weight: 500;
            color: var(--mu)
        }

        .sv {
            display: inline-block;
            background: var(--pr2);
            color: var(--pr);
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 6px
        }

        .ck {
            width: 100%;
            max-width: 420px;
            padding: 13px;
            font-size: 15px;
            margin: 6px 0
        }

        .ms {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(90deg, #0f2027, #2a7f62);
            color: #fff;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 12px;
            flex-wrap: wrap
        }

        .ms .lg2 {
            margin: 0;
            font-size: 11px;
            padding: 2px 8px
        }

        .ms a {
            color: #fff;
            text-decoration: underline;
            cursor: pointer;
            margin-left: auto;
            font-size: 13px
        }

        .bar {
            height: 8px;
            background: rgba(255, 255, 255, .25);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 10px
        }

        .bar i {
            display: block;
            height: 100%;
            background: #fff
        }

        svg text {
            fill: var(--mu);
            font-size: 10px
        }

        code {
            background: var(--pr2);
            padding: 2px 6px;
            border-radius: 4px
        }

        .lg {
            font: 12px monospace;
            color: var(--mu);
            margin-top: 6px
        }
    </style>
</head>

<body>
    <header>
        <h1>🌱 Krishi Bazar</h1>
        <div style="display:flex;gap:8px"><button class="b s" style="margin:0"
                onclick="go('register')">Register</button><select id="role" style="width:auto"
                onchange="setRole(this.value)">
                <option value="farmer">View as: Farmer</option>
                <option value="buyer">View as: Buyer</option>
                <option value="admin">View as: Admin</option>
            </select><select id="lang" style="width:auto" onchange="L=this.value;go(tab)">
                <option value="en">English</option>
                <option value="kn">ಕನ್ನಡ</option>
            </select></div>
    </header>
    <div id="badge"></div>
    <nav id="nav"></nav>
    <main id="app"></main>
    <div id="toast"></div>
    <script>
        const $ = s => document.querySelector(s); let R = "farmer", L = "en", tab = "farmer", U = [], M = {}, fid = 0, bid = 0, pc = "", ph = 2, fc = "", fl = "";
        const TT = {
            en: { farmer: "Farmer app", buyer: "Buyer portal", orders: "Orders", price: "Fair-price guide", admin: "Admin", tickets: "Tickets", register: "Register", member: "Membership", add: "List a crop", crop: "Crop", qty: "Quantity (min 100 kg)", date: "Expected harvest", pr: "Your price (₹/kg)", sug: "Suggested price", save: "Publish listing", my: "My listings", myo: "Orders for me" },
            kn: { farmer: "ರೈತ ಆ್ಯಪ್", buyer: "ಖರೀದಿದಾರ", orders: "ಆರ್ಡರ್‌ಗಳು", price: "ನ್ಯಾಯ ಬೆಲೆ", admin: "ಆಡ್ಮಿನ್", tickets: "ಟಿಕೆಟ್‌ಗಳು", register: "ನೋಂದಣಿ", add: "ಬೆಳೆ ಸೇರಿಸಿ", crop: "ಬೆಳೆ", qty: "ಪ್ರಮಾಣ (ಕನಿಷ್ಠ 100 ಕೆಜಿ)", date: "ಕೊಯ್ಲು ದಿನಾಂಕ", pr: "ನಿಮ್ಮ ಬೆಲೆ (₹/ಕೆಜಿ)", sug: "ಸೂಚಿತ ಬೆಲೆ", save: "ಪಟ್ಟಿ ಪ್ರಕಟಿಸಿ", my: "ನನ್ನ ಪಟ್ಟಿಗಳು", myo: "ನನ್ನ ಆರ್ಡರ್‌ಗಳು" }
        };
        const t = k => TT[L][k] || TT.en[k], fm = n => "₹" + Math.round(n).toLocaleString("en-IN"), fk = n => "₹" + (+n).toFixed(1);
        const dd = n => { let x = new Date(); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10) };
        const toast = m => { const e = $("#toast"); e.textContent = m; e.style.display = "block"; setTimeout(() => e.style.display = "none", 2800) };
        async function api(p, m = "GET", b) {
            const r = await fetch(p, { method: m, headers: { "Content-Type": "application/json" }, body: b ? JSON.stringify(b) : undefined }); const j = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(typeof j.detail == "string" ? j.detail : JSON.stringify(j.detail || r.statusText)); return j
        }
        const ST = ["PLACED", "FUNDED", "HARVESTED", "SHIPPED", "DELIVERED", "RELEASED"];
        const NX = { PLACED: ["fund", "cancel"], FUNDED: ["harvest", "refund", "dispute"], HARVESTED: ["ship", "dispute"], SHIPPED: ["deliver", "dispute"], DELIVERED: ["release", "dispute"], DISPUTED: ["release", "refund"] };
        const LB = { fund: "Pay deposit (demo)", cancel: "Cancel", harvest: "Mark harvested", ship: "Mark shipped", deliver: "Confirm delivery", release: "Release payment", dispute: "Raise dispute", refund: "Refund buyer", undo: "↩ Undo last step", buyer_cancel: "Cancel order (free within 15 min)" };
        const noSeed = () => `<div class="card">No users yet. In the terminal run <code>python seed.py</code>, then refresh.</div>`;
        const prem = l => l.mandi_ref ? `<span class="up">${(l.price / l.mandi_ref - 1) >= 0 ? "+" : ""}${Math.round((l.price / l.mandi_ref - 1) * 100)}%</span>${R == "buyer" ? " vs market benchmark" : " vs forecast mandi " + fk(l.mandi_ref)}` : "no mandi reference";
        const opt = (a, s) => a.map(x => `<option ${x == s ? "selected" : ""}>${x}</option>`).join("");
        function ordCard(o) {
            const i = Math.max(0, ST.indexOf(o.state)), bad = ["DISPUTED", "REFUNDED", "CANCELLED"].includes(o.state);
            return `<div class="card"><div class="row" style="align-items:center"><div><h3>#${o.id} · ${o.crop} · ${o.qty} kg</h3><div class="mu">${o.buyer} → ${o.farmer}</div></div><div><b>${fm(o.amount)}</b> <span class="tag">${o.state}</span>${o.payout != null ? `<div class="mu">You receive ${fm(o.payout)} after commission</div>` : ""}</div></div>
<div class="steps">${ST.map((_, j) => `<i class="${j <= i && !bad ? "d" : ""}"></i>`).join("")}</div>${btns(o)}<button class="b s" onclick="led(${o.id})">Audit ledger</button><div id="lg${o.id}" class="lg"></div></div>`
        }
        const PERM = { farmer: ["harvest", "ship", "cancel", "refund", "dispute"], buyer: ["fund", "cancel", "deliver", "release", "dispute"], admin: ["release", "refund"] };
        const UNDOR = { HARVESTED: "farmer", SHIPPED: "farmer", DELIVERED: "buyer" };
        function btns(o) {
            let a = (NX[o.state] || []).filter(x => PERM[R].includes(x) && (o.state == "DISPUTED" ? R == "admin" : R != "admin"));
            if (R == "buyer") { a = a.filter(x => x != "cancel"); if (["PLACED", "FUNDED"].includes(o.state)) a.push("buyer_cancel") }
            if (UNDOR[o.state] == R) a.push("undo");
            let h = a.map(x => `<button class="b s" onclick="act(${o.id},'${x}')">${LB[x]}</button>`).join("");
            if (R == "admin" && o.state == "DISPUTED") h += `<button class="b s" onclick="fault(${o.id},${o.farmer_id})">Fault: farmer</button><button class="b s" onclick="fault(${o.id},${o.buyer_id})">Fault: buyer</button>`;
            return h
        }
        async function fault(id, p) { try { await api(`/orders/${id}/fault/${p}`, "POST"); toast("Fault recorded on that party's trust score") } catch (e) { toast(e.message) } }
        async function act(id, a) { try { await api(`/orders/${id}/${a}`, "POST"); toast("Order #" + id + ": " + a + " done"); go(tab) } catch (e) { toast(e.message) } }
        async function led(id) { const r = await api(`/orders/${id}/ledger?view=${R}`); $("#lg" + id).innerHTML = r.map(e => `${e.event} · ${e.ts.slice(0, 19)} · hash ${e.hash.slice(0, 10)} ← prev ${e.prev_hash.slice(0, 10)}`).join("<br>") }
        let MR = {}, TK = {}, LST = {};
        const BT = ["Restaurant", "Hotel", "Supermarket", "Exporter", "Personal use", "Other"];
        function tkCard(t) { const s = t.status; return `<div class="card"><div class="row" style="align-items:center"><div><h3>#${t.id} · ${t.crop} · ${t.variety}</h3><div class="mu">${t.farmer ? t.farmer + " · " : ""}${t.qty} kg${t.notes ? " · " + t.notes : ""}</div></div><div><span class="tag">${s}</span></div></div>${mediaLine(t)}${s == "SCHEDULED" ? `<div class="mu">Our team will visit on ${t.visit_date}.</div>` : ""}${s == "APPROVED" ? `<div class="mu">Grade ${t.grade} · verified ${t.final_qty} kg · price agreed ${fk(t.price)}/kg${t.mandi_ref ? " · mandi that week " + fk(t.mandi_ref) : ""}. Your listing is live.</div>` : ""}${s == "REJECTED" || s == "UNPUBLISHED" ? `<div class="mu">Reason: ${t.reason || "not given"}</div>` : ""}${s == "APPROVED" && R == "admin" && t.listing_id ? `<button class="b s" onclick="unpub(${t.listing_id})">Undo publish</button>` : ""}${["OPEN", "SCHEDULED"].includes(s) && R == "farmer" ? `<button class="b s" onclick="cancelTk(${t.id})">Cancel ticket</button>` : ""}</div>` }
        function liveCard(l) { return `<div class="card"><div class="row" style="align-items:center"><div><h3>#${l.id} · ${l.crop}${l.variety ? " · " + l.variety : ""}${l.grade ? " · Grade " + l.grade : ""}</h3><div class="mu">${l.farmer_name || ""} · ${l.qty} kg left · farmer price ${fk(l.price)}/kg</div></div><div><button class="b s" onclick="unpub(${l.id})">Undo publish</button></div></div></div>` }
        async function unpub(lid) {
            const r = prompt("Undo this publish?\nThe listing disappears for buyers. If it came from a ticket, the ticket reopens so you can correct it and approve again.\n\nOptional note:", ""); if (r === null) return;
            try { const x = await api(`/listings/${lid}/unpublish?reason=${encodeURIComponent(r)}`, "POST"); toast(x.status == "OPEN" ? "Unpublished. The ticket is open again." : "Listing unpublished."); go("tickets") } catch (e) { alert(e.message) }
        }
        async function cancelTk(id) { if (!confirm("Cancel this ticket?")) return; try { await api(`/tickets/${id}/cancel`, "POST"); toast("Ticket cancelled"); go("farmer") } catch (e) { toast(e.message) } }
        function adminTk(t) {
            const m = MR[t.crop] || {}, id = t.id, md = t.media || []; TK[id] = t;
            return `<div class="card"><div class="row" style="align-items:center"><div><h3>#${id} · ${t.crop} · ${t.variety}</h3><div class="mu">${t.farmer} (${t.loc || ""})<br>Farmer says available: ${t.qty} kg${t.notes ? " · " + t.notes : ""}<br>Farm: ${t.location || "–"}<br>Call: <b>${t.phone || "–"}</b>${t.alt_phone ? " · alt " + t.alt_phone : ""}<br>Farmer's preferred visit: <b>${t.pref_date || "–"}, ${t.pref_slot || ""}</b></div></div><div><span class="tag">${t.status}</span>${t.visit_date ? `<div class="mu">Visit ${t.visit_date}</div>` : ""}</div></div>
${md.filter(x => x.kind == "video").map(x => `<video controls preload="metadata" style="width:100%;max-width:340px;border-radius:8px;margin-top:8px" src="/media/${x.id}"></video><div class="mu"><a href="/media/${x.id}" target="_blank">Open video in a new tab</a></div>`).join("")}
<div>${md.filter(x => x.kind == "photo").map(x => `<a href="/media/${x.id}" target="_blank"><img loading="lazy" src="/media/${x.id}" style="width:84px;height:84px;object-fit:cover;border-radius:8px;margin:6px 6px 0 0"></a>`).join("")}</div>
<div class="mu" style="margin-top:6px">${m.latest != null ? `Current mandi ${fk(m.latest)}/kg (week of ${m.as_of}). Suggested farmer price: A ${fk(m.suggest.A)} · B ${fk(m.suggest.B)} · C ${fk(m.suggest.C)}` : "No mandi price found for this crop. Enter the price manually."}</div>
<div class="row"><div><label>Visit date</label><input id="vd${id}" type="date" value="${t.visit_date || t.pref_date || ""}"></div><div><label>Grade</label><select id="gr${id}" onchange="gsel(${id})"><option>A</option><option selected>B</option><option>C</option></select></div><div><label>Verified qty (kg)</label><input id="vq${id}" type="number" value="${t.qty}"></div><div><label>Farmer price ₹/kg</label><input id="vp${id}" type="number" step="0.1" value="${m.latest != null ? m.suggest.B : ""}"></div></div>
<div class="row"><div><label>Buyer's mandi cost ₹/kg (helper, not saved)</label><input id="mc${id}" type="number" step="0.1" oninput="mkHint(${id})"></div><div><label>Buyer markup % (blank = default)</label><input id="mk${id}" type="number" step="0.1" min="0" max="10" oninput="mkHint(${id})"></div><div><label>Early access hours (0 = none)</label><input id="eh${id}" type="number" min="0" max="720" value="0"></div></div><div class="mu" id="mh${id}">Enter the buyer's mandi cost to see the highest markup that keeps the free buyer below it.</div><label><input id="ag${id}" type="checkbox" style="width:auto"> Farmer has agreed to this price on the spot</label>
<button class="b s" onclick="sched(${id})">Schedule visit</button><button class="b" onclick="approve(${id})">Approve &amp; publish</button><button class="b s" onclick="rejectTk(${id})">Reject</button></div>`
        }
        function mk(id) { const v = $("#mk" + id).value.trim(), h = +$("#eh" + id).value || 0; if (h < 0 || h > 720) throw new Error("Early access hours must be 0 to 720."); let m = -1; if (v !== "") { m = +v / 100; if (!(m >= 0 && m <= 0.1)) throw new Error("Buyer markup must be between 0 and 10 %.") } return { buyer_markup: m, early_hours: h } }

        const TABS = { farmer: ["farmer"], buyer: ["buyer", "member", "orders"], admin: ["admin", "tickets", "orders", "price"] };
        function setRole(r) { R = r; go(TABS[r][0]) }
        async function go(x) {
            tab = x; $("#nav").innerHTML = TABS[R].map(k => `<button class="${k == x ? "on" : ""}" onclick="go('${k}')">${t(k)}</button>`).join(""); $("#app").innerHTML = "Loading…";
            try { $("#app").innerHTML = await V[x](); after[x] && after[x]() } catch (e) { $("#app").innerHTML = `<div class="card">Error: ${e.message}</div>` }
        }
        (async () => {
            try {
                M = await api("/meta"); U = await api("/users"); fid = (U.find(u => u.role == "farmer") || {}).id; bid = (U.find(u => u.role == "buyer") || {}).id; pc = M.crops[0];
                $("#badge").className = M.synthetic ? "w" : ""; $("#badge").textContent = M.synthetic ? "⚠ SYNTHETIC price data – demo only, not real results" : `✔ Real mandi price data · ${M.rows.toLocaleString()} rows · ${M.from} → ${M.to} · users, listings & orders are demo seed data`; go("farmer")
            }
            catch (e) { $("#app").innerHTML = `<div class="card">Cannot reach the API: ${e.message}. Is <code>uvicorn app.main:app</code> running, and does data/prices.csv exist?</div>` }
        })();
    </script>
    <script>/*KB-TIERS*/
        (function () {
            function earlyNote(l) {
                l = l || {}; const t = l.early_access_until ? new Date(l.early_access_until) : null, fut = !!t && t > new Date(), w = fut ? t.toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
                if (l.locked_for_you) return `<div class="mu" style="color:#b45309;font-weight:600">🔒 Early access for Plus members. Opens to everyone on ${w}</div>`;
                if (fut && l.subscriber_rate) return `<div class="mu" style="color:var(--pr);font-weight:600">⚡ Plus early access. Opens to others on ${w}</div>`; return ""
            }
            window.earlyNote = earlyNote;
            V.buyer = async () => {
                const B = U.filter(u => u.role == "buyer"); if (!B.length) return noSeed();
                const sb = await api(`/subscription/${bid}`), ls = await api(`/listings?view=buyer&buyer_id=${bid}&crop=${encodeURIComponent(fc)}&loc=${encodeURIComponent(fl)}`), locs = [...new Set(U.filter(u => u.role == "farmer").map(u => u.loc))];
                const top = sb.active ? (typeof memStrip == "function" ? memStrip(sb) : `<div class="mu">✔ Plus member until ${sb.ends}</div>`) : `<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:220px"><b>Free plan</b><div class="mu">Plus members pay a lower service margin on every listing and see new listings first.</div></div><button class="b" onclick="go('member')">See Plus</button></div>`;
                return top + `<div class="card"><div class="row"><div><label>Buying as</label><select onchange="bid=+this.value;go('buyer')">${B.map(b => `<option value="${b.id}" ${b.id == bid ? "selected" : ""}>${b.name}</option>`).join("")}</select></div><div><label>Crop</label><select onchange="fc=this.value;go('buyer')"><option value="">All crops</option>${opt(M.crops, fc)}</select></div><div><label>Location</label><select onchange="fl=this.value;go('buyer')"><option value="">All locations</option>${opt(locs, fl)}</select></div></div></div><div class="grid">${ls.map(l => {
                    const r = l.farmer_reliability, mn = Math.min(sb.min_order, l.qty); LST[l.id] = l;
                    return `<div class="card"><h3>${l.crop}${l.variety ? " · " + l.variety : ""}${l.grade ? ` <span class="tag">Grade ${l.grade}</span>` : ""} <span class="tag">${l.loc}</span></h3><div class="mu">${l.farmer_name} · trust ${r.lower} (${r.n} deals)<br>${l.qty} kg available</div><div class="big">${fk(l.price)}/kg</div>${l.subscriber_rate ? '<span class="tag">Plus price</span>' : ""}<div class="mu">${prem(l)}</div><div class="mu">${mn} kg = <b>${fm(l.price * mn)}</b></div>${earlyNote(l)}` + (l.locked_for_you ? "" : `<label>Order qty (kg)</label><input id="oq${l.id}" type="number" value="${mn}" min="${mn}"><label>Deposit into escrow</label><select id="dp${l.id}"><option value="0.3">30%</option><option value="0.5">50%</option><option value="1">100%</option></select><button class="b" onclick="order(${l.id})">Order &amp; pay deposit (demo)</button>`) + `</div>`
                }).join("") || '<p class="mu">No listings match.</p>'}</div>`
            };
            window.bmWarn = function (id) {
                const p = +$("#vp" + id).value, c = +$("#bc" + id).value, m = $("#bm" + id).value, e = $("#bw" + id); if (!p || !c) { e.textContent = ""; return } const mx = (c / p - 1) * 100;
                e.innerHTML = `Highest markup that keeps a free buyer below their mandi cost (${fk(c)}): <b>${mx.toFixed(1)}%</b>` + (m !== "" && +m > mx ? ` <span style="color:#dc2626">· your ${(+m).toFixed(1)}% is above it (warning only)</span>` : "") + (mx < 0 ? ` <span style="color:#dc2626">· the farmer price is already above their mandi cost</span>` : "")
            };
            if (typeof adminTk === "function") {
                const _a = adminTk; adminTk = function (t) {
                    const h = _a(t), id = t.id, k = '<label><input id="ag' + id + '"'; if (h.includes('id="bm' + id + '"') || !h.includes(k)) return h;
                    return h.replace(k, `<div class="row"><div><label>Buyer's mandi cost ₹/kg (helper, not stored)</label><input id="bc${id}" type="number" step="0.1" oninput="bmWarn(${id})"></div><div><label>Free-buyer markup % (blank = default)</label><input id="bm${id}" type="number" step="0.1" min="0" max="10" oninput="bmWarn(${id})"></div><div><label>Early access for Plus (hours, 0 = none)</label><input id="eh${id}" type="number" min="0" max="720" value="0"></div></div><div id="bw${id}" class="mu"></div>` + k)
                }
            }
            if (typeof gsel === "function") { const _g = gsel; gsel = function (id) { _g(id); if ($("#bc" + id)) bmWarn(id) } }
            document.addEventListener("input", e => { const m = (e.target.id || "").match(/^vp(\d+)$/); if (m && $("#bc" + m[1])) bmWarn(m[1]) });
            approve = async function (id) {
                if (!$("#ag" + id).checked) { alert("Please confirm the farmer has agreed to this price on the spot."); return }
                const bmv = $("#bm" + id) ? $("#bm" + id).value.trim() : "", eh = $("#eh" + id) ? (+$("#eh" + id).value || 0) : 0;
                if (bmv !== "" && !(+bmv >= 0 && +bmv <= 10)) { alert("Buyer markup must be between 0% and 10%."); return }
                if (!(eh >= 0 && eh <= 720)) { alert("Early-access hours must be between 0 and 720."); return }
                try { await api(`/tickets/${id}/approve`, "POST", { grade: $("#gr" + id).value, qty: +$("#vq" + id).value, price: +$("#vp" + id).value, agreed: true, buyer_markup: bmv === "" ? -1 : +bmv / 100, early_hours: eh }); toast("Approved. The listing is now live."); go("tickets") } catch (e) { alert(e.message) }
            };
            V.settings = async () => {
                const s = await api("/admin/settings"), pt = x => String(Math.round(x * 10000) / 100);
                return `<div class="card"><h2>Rates</h2><p class="mu">Each rate is capped at ${pt(s.cap)}%. Changes apply to new orders only.</p><div class="row"><div><label>Farmer commission % (on delivered orders)</label><input id="sf" type="number" step="0.1" min="0" max="${pt(s.cap)}" value="${pt(s.farmer_fee)}"></div><div><label>Default buyer markup % (when a listing has none)</label><input id="sm" type="number" step="0.1" min="0" max="${pt(s.cap)}" value="${pt(s.default_markup)}"></div><div><label>Plus discount (points off the markup)</label><input id="sd" type="number" step="0.1" min="0" max="${pt(s.cap)}" value="${pt(s.sub_discount)}"></div></div><button class="b" onclick="saveRates()">Save rates</button></div>`
            };
            window.saveRates = async function () { const f = id => +$("#" + id).value / 100; try { await api("/admin/settings", "POST", { farmer_fee: f("sf"), default_markup: f("sm"), sub_discount: f("sd") }); toast("Rates saved"); go("settings") } catch (e) { alert(e.message) } };
            TT.en.settings = "Settings"; TT.kn.settings = "Settings"; if (!TABS.admin.includes("settings")) TABS.admin.push("settings");
        })();
    </script>
</body>
