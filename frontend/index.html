<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Krishi Bazar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
        :root {
            --bg: #f6f8f3;
            --card: #fff;
            --tx: #1d2a1f;
            --mu: #667568;
            --pr: #2f7d32;
            --pr2: #e3f1e2;
            --bd: #dde4d9;
            --wr: #b26a00
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --bg: #121a14;
                --card: #1b261d;
                --tx: #e7efe8;
                --mu: #97a89a;
                --pr: #6fcf74;
                --pr2: #23382a;
                --bd: #2b3b2e;
                --wr: #f0b45a
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.45 system-ui, Segoe UI, Roboto, sans-serif
        }

        header {
            background: var(--pr);
            color: #fff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        header h1 {
            font-size: 18px;
            margin: 0
        }

        #badge {
            padding: 6px 16px;
            font-size: 13px;
            background: var(--pr2);
            color: var(--pr)
        }

        #badge.w {
            background: var(--wr);
            color: #fff
        }

        nav {
            display: flex;
            gap: 4px;
            padding: 8px;
            overflow-x: auto;
            background: var(--card);
            border-bottom: 1px solid var(--bd);
            position: sticky;
            top: 0;
            z-index: 5
        }

        nav button {
            border: 0;
            background: none;
            color: var(--mu);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap
        }

        nav button.on {
            background: var(--pr2);
            color: var(--pr);
            font-weight: 600
        }

        main {
            max-width: 980px;
            margin: 0 auto;
            padding: 14px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px
        }

        h2 {
            font-size: 17px;
            margin: 0 0 10px
        }

        h3 {
            font-size: 15px;
            margin: 0 0 4px
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--mu);
            margin: 8px 0 3px
        }

        input,
        select {
            width: 100%;
            padding: 9px;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--bg);
            color: var(--tx);
            font-size: 15px
        }

        .b {
            background: var(--pr);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            margin: 8px 4px 0 0
        }

        .b.s {
            background: var(--pr2);
            color: var(--pr)
        }

        .mu {
            color: var(--mu);
            font-size: 13px
        }

        .tag {
            background: var(--pr2);
            color: var(--pr);
            border-radius: 10px;
            padding: 2px 8px;
            font-size: 12px
        }

        .big {
            font-size: 22px;
            font-weight: 700;
            color: var(--pr)
        }

        .up {
            color: var(--pr);
            font-weight: 600
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 12px
        }

        .tw {
            overflow-x: auto
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 560px
        }

        th,
        td {
            text-align: left;
            padding: 7px;
            border-bottom: 1px solid var(--bd);
            font-size: 13px
        }

        .steps {
            display: flex;
            gap: 4px;
            margin: 8px 0
        }

        .steps i {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: var(--bd)
        }

        .steps i.d {
            background: var(--pr)
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .row>* {
            flex: 1;
            min-width: 130px
        }

        #toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 16px;
            background: var(--tx);
            color: var(--bg);
            padding: 10px 16px;
            border-radius: 20px;
            display: none;
            z-index: 9;
            max-width: 90%
        }

        .sb {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            z-index: 20;
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 8px;
            max-height: 240px;
            overflow-y: auto;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .15)
        }

        .sb div {
            padding: 9px 12px;
            cursor: pointer;
            font-size: 14px
        }

        .sb div:hover {
            background: var(--pr2)
        }

        .pl {
            background: linear-gradient(135deg, #0f2027, #1f4e5f 60%, #2a7f62);
            color: #fff;
            border-radius: 18px;
            padding: 26px;
            margin-bottom: 16px
        }

        .pl h1 {
            margin: 0 0 6px;
            font-size: 26px
        }

        .pl p {
            margin: 0;
            opacity: .9
        }

        .lg2 {
            display: inline-block;
            background: #fff;
            color: #0f5132;
            border-radius: 6px;
            padding: 2px 10px;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: .8px;
            margin-bottom: 10px
        }

        .bn {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 10px;
            margin-bottom: 12px
        }

        .bn>div {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 12px
        }

        .bn>div>span {
            font-size: 22px
        }

        .bn b {
            display: block;
            font-size: 14px
        }

        .pc {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
            margin: 14px 0
        }

        .pp {
            position: relative;
            background: var(--card);
            border: 2px solid var(--bd);
            border-radius: 16px;
            padding: 22px 16px 16px;
            cursor: pointer;
            transition: border-color .15s, box-shadow .15s
        }

        .pp:hover {
            border-color: var(--pr)
        }

        .pp.on {
            border-color: var(--pr);
            box-shadow: 0 0 0 3px rgba(34, 160, 90, .25)
        }

        .pp .rd {
            position: absolute;
            right: 14px;
            top: 18px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--bd)
        }

        .pp.on .rd {
            border: 6px solid var(--pr)
        }

        .pp .tg {
            position: absolute;
            left: 14px;
            top: -11px;
            background: #f59e0b;
            color: #1a1a1a;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 99px
        }

        .pp .pr {
            font-size: 30px;
            font-weight: 800
        }

        .pp .pr small {
            font-size: 14px;
            font-weight: 500;
            color: var(--mu)
        }

        .sv {
            display: inline-block;
            background: var(--pr2);
            color: var(--pr);
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 6px
        }

        .ck {
            width: 100%;
            max-width: 420px;
            padding: 13px;
            font-size: 15px;
            margin: 6px 0
        }

        .ms {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(90deg, #0f2027, #2a7f62);
            color: #fff;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 12px;
            flex-wrap: wrap
        }

        .ms .lg2 {
            margin: 0;
            font-size: 11px;
            padding: 2px 8px
        }

        .ms a {
            color: #fff;
            text-decoration: underline;
            cursor: pointer;
            margin-left: auto;
            font-size: 13px
        }

        .bar {
            height: 8px;
            background: rgba(255, 255, 255, .25);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 10px
        }

        .bar i {
            display: block;
            height: 100%;
            background: #fff
        }

        svg text {
            fill: var(--mu);
            font-size: 10px
        }

        code {
            background: var(--pr2);
            padding: 2px 6px;
            border-radius: 4px
        }

        .lg {
            font: 12px monospace;
            color: var(--mu);
            margin-top: 6px
        }
    </style>
</head>

<body>
    <header>
        <h1>🌱 Krishi Bazar</h1>
        <div style="display:flex;gap:8px"><button class="b s" style="margin:0"
                onclick="go('register')">Register</button><select id="role" style="width:auto"
                onchange="setRole(this.value)">
                <option value="farmer">View as: Farmer</option>
                <option value="buyer">View as: Buyer</option>
                <option value="admin">View as: Admin</option>
            </select><select id="lang" style="width:auto" onchange="L=this.value;go(tab)">
                <option value="en">English</option>
                <option value="kn">ಕನ್ನಡ</option>
            </select></div>
    </header>
    <div id="badge"></div>
    <nav id="nav"></nav>
    <main id="app"></main>
    <div id="toast"></div>
    <script>
        const $ = s => document.querySelector(s); let R = "farmer", L = "en", tab = "farmer", U = [], M = {}, fid = 0, bid = 0, pc = "", ph = 2, fc = "", fl = "";
        const TT = {
            en: { farmer: "Farmer app", buyer: "Buyer portal", orders: "Orders", price: "Fair-price guide", admin: "Admin", tickets: "Tickets", register: "Register", member: "Membership", add: "List a crop", crop: "Crop", qty: "Quantity (min 100 kg)", date: "Expected harvest", pr: "Your price (₹/kg)", sug: "Suggested price", save: "Publish listing", my: "My listings", myo: "Orders for me" },
            kn: { farmer: "ರೈತ ಆ್ಯಪ್", buyer: "ಖರೀದಿದಾರ", orders: "ಆರ್ಡರ್‌ಗಳು", price: "ನ್ಯಾಯ ಬೆಲೆ", admin: "ಆಡ್ಮಿನ್", tickets: "ಟಿಕೆಟ್‌ಗಳು", register: "ನೋಂದಣಿ", add: "ಬೆಳೆ ಸೇರಿಸಿ", crop: "ಬೆಳೆ", qty: "ಪ್ರಮಾಣ (ಕನಿಷ್ಠ 100 ಕೆಜಿ)", date: "ಕೊಯ್ಲು ದಿನಾಂಕ", pr: "ನಿಮ್ಮ ಬೆಲೆ (₹/ಕೆಜಿ)", sug: "ಸೂಚಿತ ಬೆಲೆ", save: "ಪಟ್ಟಿ ಪ್ರಕಟಿಸಿ", my: "ನನ್ನ ಪಟ್ಟಿಗಳು", myo: "ನನ್ನ ಆರ್ಡರ್‌ಗಳು" }
        };
        const t = k => TT[L][k] || TT.en[k], fm = n => "₹" + Math.round(n).toLocaleString("en-IN"), fk = n => "₹" + (+n).toFixed(1);
        const dd = n => { let x = new Date(); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10) };
        const toast = m => { const e = $("#toast"); e.textContent = m; e.style.display = "block"; setTimeout(() => e.style.display = "none", 2800) };
        async function api(p, m = "GET", b) {
            const r = await fetch(p, { method: m, headers: { "Content-Type": "application/json" }, body: b ? JSON.stringify(b) : undefined }); const j = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(typeof j.detail == "string" ? j.detail : JSON.stringify(j.detail || r.statusText)); return j
        }
        const ST = ["PLACED", "FUNDED", "HARVESTED", "SHIPPED", "DELIVERED", "RELEASED"];
        const NX = { PLACED: ["fund", "cancel"], FUNDED: ["harvest", "refund", "dispute"], HARVESTED: ["ship", "dispute"], SHIPPED: ["deliver", "dispute"], DELIVERED: ["release", "dispute"], DISPUTED: ["release", "refund"] };
        const LB = { fund: "Pay deposit (demo)", cancel: "Cancel", harvest: "Mark harvested", ship: "Mark shipped", deliver: "Confirm delivery", release: "Release payment", dispute: "Raise dispute", refund: "Refund buyer", undo: "↩ Undo last step", buyer_cancel: "Cancel order (free within 15 min)" };
        const noSeed = () => `<div class="card">No users yet. In the terminal run <code>python seed.py</code>, then refresh.</div>`;
        const prem = l => l.mandi_ref ? `<span class="up">${(l.price / l.mandi_ref - 1) >= 0 ? "+" : ""}${Math.round((l.price / l.mandi_ref - 1) * 100)}%</span>${R == "buyer" ? " vs market benchmark" : " vs forecast mandi " + fk(l.mandi_ref)}` : "no mandi reference";
        const opt = (a, s) => a.map(x => `<option ${x == s ? "selected" : ""}>${x}</option>`).join("");
        function ordCard(o) {
            const i = Math.max(0, ST.indexOf(o.state)), bad = ["DISPUTED", "REFUNDED", "CANCELLED"].includes(o.state);
            return `<div class="card"><div class="row" style="align-items:center"><div><h3>#${o.id} · ${o.crop} · ${o.qty} kg</h3><div class="mu">${o.buyer} → ${o.farmer}</div></div><div><b>${fm(o.amount)}</b> <span class="tag">${o.state}</span>${o.payout != null ? `<div class="mu">You receive ${fm(o.payout)} after commission</div>` : ""}</div></div>
<div class="steps">${ST.map((_, j) => `<i class="${j <= i && !bad ? "d" : ""}"></i>`).join("")}</div>${btns(o)}<button class="b s" onclick="led(${o.id})">Audit ledger</button><div id="lg${o.id}" class="lg"></div></div>`
        }
        const PERM = { farmer: ["harvest", "ship", "cancel", "refund", "dispute"], buyer: ["fund", "cancel", "deliver", "release", "dispute"], admin: ["release", "refund"] };
        const UNDOR = { HARVESTED: "farmer", SHIPPED: "farmer", DELIVERED: "buyer" };
        function btns(o) {
            let a = (NX[o.state] || []).filter(x => PERM[R].includes(x) && (o.state == "DISPUTED" ? R == "admin" : R != "admin"));
            if (R == "buyer") { a = a.filter(x => x != "cancel"); if (["PLACED", "FUNDED"].includes(o.state)) a.push("buyer_cancel") }
            if (UNDOR[o.state] == R) a.push("undo");
            let h = a.map(x => `<button class="b s" onclick="act(${o.id},'${x}')">${LB[x]}</button>`).join("");
            if (R == "admin" && o.state == "DISPUTED") h += `<button class="b s" onclick="fault(${o.id},${o.farmer_id})">Fault: farmer</button><button class="b s" onclick="fault(${o.id},${o.buyer_id})">Fault: buyer</button>`;
            return h
        }
        async function fault(id, p) { try { await api(`/orders/${id}/fault/${p}`, "POST"); toast("Fault recorded on that party's trust score") } catch (e) { toast(e.message) } }
        async function act(id, a) { try { await api(`/orders/${id}/${a}`, "POST"); toast("Order #" + id + ": " + a + " done"); go(tab) } catch (e) { toast(e.message) } }
        async function led(id) { const r = await api(`/orders/${id}/ledger?view=${R}`); $("#lg" + id).innerHTML = r.map(e => `${e.event} · ${e.ts.slice(0, 19)} · hash ${e.hash.slice(0, 10)} ← prev ${e.prev_hash.slice(0, 10)}`).join("<br>") }
        let MR = {}, TK = {}, LST = {};
        const BT = ["Restaurant", "Hotel", "Supermarket", "Exporter", "Personal use", "Other"];
        function tkCard(t) { const s = t.status; return `<div class="card"><div class="row" style="align-items:center"><div><h3>#${t.id} · ${t.crop} · ${t.variety}</h3><div class="mu">${t.farmer ? t.farmer + " · " : ""}${t.qty} kg${t.notes ? " · " + t.notes : ""}</div></div><div><span class="tag">${s}</span></div></div>${mediaLine(t)}${s == "SCHEDULED" ? `<div class="mu">Our team will visit on ${t.visit_date}.</div>` : ""}${s == "APPROVED" ? `<div class="mu">Grade ${t.grade} · verified ${t.final_qty} kg · price agreed ${fk(t.price)}/kg${t.mandi_ref ? " · mandi that week " + fk(t.mandi_ref) : ""}. Your listing is live.</div>` : ""}${s == "REJECTED" || s == "UNPUBLISHED" ? `<div class="mu">Reason: ${t.reason || "not given"}</div>` : ""}${s == "APPROVED" && R == "admin" && t.listing_id ? `<button class="b s" onclick="unpub(${t.listing_id})">Undo publish</button>` : ""}${["OPEN", "SCHEDULED"].includes(s) && R == "farmer" ? `<button class="b s" onclick="cancelTk(${t.id})">Cancel ticket</button>` : ""}</div>` }
        function liveCard(l) { return `<div class="card"><div class="row" style="align-items:center"><div><h3>#${l.id} · ${l.crop}${l.variety ? " · " + l.variety : ""}${l.grade ? " · Grade " + l.grade : ""}</h3><div class="mu">${l.farmer_name || ""} · ${l.qty} kg left · farmer price ${fk(l.price)}/kg</div></div><div><button class="b s" onclick="unpub(${l.id})">Undo publish</button></div></div></div>` }
        async function unpub(lid) {
            const r = prompt("Undo this publish?\nThe listing disappears for buyers. If it came from a ticket, the ticket reopens so you can correct it and approve again.\n\nOptional note:", ""); if (r === null) return;
            try { const x = await api(`/listings/${lid}/unpublish?reason=${encodeURIComponent(r)}`, "POST"); toast(x.status == "OPEN" ? "Unpublished. The ticket is open again." : "Listing unpublished."); go("tickets") } catch (e) { alert(e.message) }
        }
        async function cancelTk(id) { if (!confirm("Cancel this ticket?")) return; try { await api(`/tickets/${id}/cancel`, "POST"); toast("Ticket cancelled"); go("farmer") } catch (e) { toast(e.message) } }
        function adminTk(t) {
            const m = MR[t.crop] || {}, id = t.id, md = t.media || []; TK[id] = t;
            return `<div class="card"><div class="row" style="align-items:center"><div><h3>#${id} · ${t.crop} · ${t.variety}</h3><div class="mu">${t.farmer} (${t.loc || ""})<br>Farmer says available: ${t.qty} kg${t.notes ? " · " + t.notes : ""}<br>Farm: ${t.location || "–"}<br>Call: <b>${t.phone || "–"}</b>${t.alt_phone ? " · alt " + t.alt_phone : ""}<br>Farmer's preferred visit: <b>${t.pref_date || "–"}, ${t.pref_slot || ""}</b></div></div><div><span class="tag">${t.status}</span>${t.visit_date ? `<div class="mu">Visit ${t.visit_date}</div>` : ""}</div></div>
${md.filter(x => x.kind == "video").map(x => `<video controls preload="metadata" style="width:100%;max-width:340px;border-radius:8px;margin-top:8px" src="/media/${x.id}"></video><div class="mu"><a href="/media/${x.id}" target="_blank">Open video in a new tab</a></div>`).join("")}
<div>${md.filter(x => x.kind == "photo").map(x => `<a href="/media/${x.id}" target="_blank"><img loading="lazy" src="/media/${x.id}" style="width:84px;height:84px;object-fit:cover;border-radius:8px;margin:6px 6px 0 0"></a>`).join("")}</div>
<div class="mu" style="margin-top:6px">${m.latest != null ? `Current mandi ${fk(m.latest)}/kg (week of ${m.as_of}). Suggested farmer price: A ${fk(m.suggest.A)} · B ${fk(m.suggest.B)} · C ${fk(m.suggest.C)}` : "No mandi price found for this crop. Enter the price manually."}</div>
<div class="row"><div><label>Visit date</label><input id="vd${id}" type="date" value="${t.visit_date || t.pref_date || ""}"></div><div><label>Grade</label><select id="gr${id}" onchange="gsel(${id})"><option>A</option><option selected>B</option><option>C</option></select></div><div><label>Verified qty (kg)</label><input id="vq${id}" type="number" value="${t.qty}"></div><div><label>Farmer price ₹/kg</label><input id="vp${id}" type="number" step="0.1" value="${m.latest != null ? m.suggest.B : ""}"></div></div>
<div class="row"><div><label>Buyer's mandi cost ₹/kg (helper, not saved)</label><input id="mc${id}" type="number" step="0.1" oninput="mkHint(${id})"></div><div><label>Buyer markup % (blank = default)</label><input id="mk${id}" type="number" step="0.1" min="0" max="10" oninput="mkHint(${id})"></div><div><label>Early access hours (0 = none)</label><input id="eh${id}" type="number" min="0" max="720" value="0"></div></div><div class="mu" id="mh${id}">Enter the buyer's mandi cost to see the highest markup that keeps the free buyer below it.</div><label><input id="ag${id}" type="checkbox" style="width:auto"> Farmer has agreed to this price on the spot</label>
<button class="b s" onclick="sched(${id})">Schedule visit</button><button class="b" onclick="approve(${id})">Approve &amp; publish</button><button class="b s" onclick="rejectTk(${id})">Reject</button></div>`
        }
        function mk(id) { const v = $("#mk" + id).value.trim(), h = +$("#eh" + id).value || 0; if (h < 0 || h > 720) throw new Error("Early access hours must be 0 to 720."); let m = -1; if (v !== "") { m = +v / 100; if (!(m >= 0 && m <= 0.1)) throw new Error("Buyer markup must be between 0 and 10 %.") } return { buyer_markup: m, early_hours: h } }

function tp(s){const t=s.trim(),x=KX[t];if(x!==undefined)return s.replace(t,x);let o=s;for(const[a,b]of KP)if(o.includes(a))o=o.split(a).join(b);return o}
function tr(root){if(L!=="kn"||R!=="buyer"||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];let n;while(n=w.nextNode())ns.push(n);
 for(const t of ns){const p=t.parentElement;if(p&&p.tagName==="OPTION"&&!p.hasAttribute("value"))continue;const r=t.nodeValue;if(!r.trim())continue;const o=tp(r);if(o!==r)t.nodeValue=o}}
const _go=go;go=async function(x){await _go(x);tr(document.getElementById("app"))};
const _c=window.confirm,_a=window.alert,T=s=>(L==="kn"&&R==="buyer")?tp(String(s)):String(s);
window.confirm=m=>_c.call(window,T(m));window.alert=m=>_a.call(window,T(m));
const tb=document.getElementById("toast");if(tb)new MutationObserver(()=>{if(L!=="kn"||R!=="buyer")return;const o=tb.textContent,n=tp(o);if(n!==o)tb.textContent=n}).observe(tb,{childList:true,characterData:true,subtree:true});
})();
</script><script>/*KB-ADMIN*/
(function () {
    const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const FS = { PLACED: "Placed · awaiting deposit", FUNDED: "Deposit in escrow", HARVESTED: "Harvested", SHIPPED: "Shipped", DELIVERED: "Delivered · awaiting release", RELEASED: "Paid out", DISPUTED: "Disputed · needs you", REFUNDED: "Refunded", CANCELLED: "Cancelled" };
    const SC = { DISPUTED: "background:#fee2e2;color:#b91c1c", DELIVERED: "background:#fef3c7;color:#92400e", RELEASED: "background:#dcfce7;color:#166534" };
    const stTag = s => `<span class="tag" style="${SC[s] || ""}">${esc(FS[s] || s)}</span>`;
    const paid = o => +(o.buyer_amount || o.amount) || 0;
    const live = o => !["CANCELLED", "REFUNDED"].includes(o.state);
    const ts = o => { const x = new Date(o.created).getTime(); return isNaN(x) ? 0 : x };
    const when = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) };
    const ago = s => { const d = new Date(s); if (isNaN(d)) return ""; const m = Math.max(0, Math.round((Date.now() - d) / 6e4)); return (m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.floor(m / 60) + " h ago" : Math.floor(m / 1440) + " d ago") + " (" + d.toLocaleDateString("en-IN", { day: "numeric", month: "short" }) + ")" };
    const midnight = n => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - n); return d.getTime() };
    const byId = (a, b) => b.id - a.id;
    let ADM_U = [], DW = 30;

    function groups(os) {
        const t0 = midnight(0), y0 = midnight(1), w0 = midnight(7);
        const G = [{ k: "Today", s: "", r: [] }, { k: "Yesterday", s: "", r: [] }, { k: "Last 7 days", s: "before yesterday", r: [] }, { k: "Older", s: "", r: [] }];
        [...os].sort((a, b) => ts(b) - ts(a) || b.id - a.id).forEach(o => { const x = ts(o); G[x >= t0 ? 0 : x >= y0 ? 1 : x >= w0 ? 2 : 3].r.push(o) });
        return G
    }
    function demand(os, days, lv) {
        const cut = days ? Date.now() - days * 864e5 : 0, m = {};
        os.filter(o => live(o) && (!days || ts(o) >= cut)).forEach(o => { const c = m[o.crop] || (m[o.crop] = { crop: o.crop, n: 0, kg: 0, val: 0, stock: 0 }); c.n++; c.kg += +o.qty || 0; c.val += paid(o) });
        lv.forEach(l => { if (m[l.crop]) m[l.crop].stock += +l.qty || 0 });
        return Object.values(m).sort((a, b) => b.kg - a.kg || b.n - a.n)
    }
    function admCard(o) {
        let h = ordCard(o);
        h = h.replace(String(o.buyer) + " → " + String(o.farmer) + "</div>", () => esc(o.buyer) + " → " + esc(o.farmer) + "<br>Placed " + when(o.created) + "</div>");
        h = h.replace('<span class="tag">' + o.state + "</span>", () => stTag(o.state));
        h = h.replace("<b>" + fm(o.amount) + "</b>", () => "<b>" + fm(paid(o)) + '</b> <span class="mu">buyer paid</span><div class="mu">Farmer value ' + fm(o.amount) + "</div>");
        return h
    }

    window.setDW = n => { DW = n; go("admin") };
    window.userRows = function () {
        const q = ($("#us") ? $("#us").value : "").trim().toLowerCase(), qd = q.replace(/\D/g, ""), rf = $("#ur") ? $("#ur").value : "", today = new Date().toLocaleDateString("en-CA");
        const rows = ADM_U.filter(u => (!rf || u.role == rf) && (!q || [u.name, u.loc, u.buyer_type, u.role, u.phone].join(" ").toLowerCase().includes(q) || (qd.length >= 3 && (u.phones || []).some(p => String(p).replace(/\D/g, "").includes(qd)))));
        $("#ub").innerHTML = rows.map(u => {
            const also = (u.phones || []).filter(p => p && p !== u.phone);
            const plan = u.role == "buyer" ? (u.plus_until && u.plus_until >= today ? "Plus until " + esc(u.plus_until) : "Free") : "";
            return `<tr><td><b>${esc(u.name)}</b></td><td>${u.role == "farmer" ? "Farmer" : "Buyer"}</td><td>${esc(u.phone || "–")}${also.length ? `<div class="mu">also ${esc(also.join(", "))}</div>` : ""}</td><td>${esc(u.buyer_type || (u.role == "farmer" ? "–" : ""))}${plan ? `<div class="mu">${plan}</div>` : ""}</td><td>${esc(u.loc || "–")}</td></tr>`
        }).join("") || '<tr><td colspan="5" class="mu">No user matches your search.</td></tr>';
        $("#uc").textContent = "· showing " + rows.length + " of " + ADM_U.length
    };
    after.admin = () => window.userRows();

    V.admin = async () => {
        const [s, os, tk, lv, us] = await Promise.all([api("/admin/summary"), api("/orders?view=admin"), api("/tickets?view=admin"), api("/listings?view=admin"), api("/users")]);
        U = us; ADM_U = us.filter(u => u.role != "admin");
        const wait = tk.filter(x => ["OPEN", "SCHEDULED"].includes(x.status)), fresh = tk.filter(x => x.status == "OPEN").length, disp = os.filter(o => o.state == "DISPUTED").length;
        const t0 = midnight(0), today = os.filter(o => ts(o) >= t0), stock = lv.reduce((a, l) => a + (+l.qty || 0), 0);
        const card = (lbl, val, hint, to, warn) => `<div class="card"${to ? ` onclick="go('${to}')" style="cursor:pointer${warn ? ";border:2px solid #dc2626" : ""}"` : ""}><div class="mu">${lbl}</div><div class="big">${val}</div><div class="mu">${hint}</div></div>`;
        const earn = (+s.platform_fee || 0) + (+s.buyer_margin || 0) + (+s.subscription_revenue || 0);
        const dm = demand(os, DW || 0, lv), top = dm.length ? dm[0].kg : 1;
        const dbtn = (n, l) => `<button class="b s" style="${DW === n ? "outline:2px solid var(--pr)" : ""}" onclick="setDW(${n})">${l}</button>`;
        const recent = [...os].sort((a, b) => ts(b) - ts(a) || b.id - a.id).slice(0, 5);
        return `<h2>Needs your attention</h2><div class="stats">${card("Tickets waiting", wait.length, fresh + " not yet scheduled", "tickets")}${card("Disputed orders", disp, disp ? "Open Orders to resolve them" : "None, all clear", "orders", disp > 0)}${card("Orders today", today.length, fm(today.filter(live).reduce((a, o) => a + paid(o), 0)) + " from buyers", "orders")}${card("Live listings", lv.length, stock.toLocaleString("en-IN") + " kg in stock", "tickets")}</div>
<h2 style="margin-top:16px">Money <span class="mu" style="font-weight:400">· counted on paid-out (released) orders</span></h2><div class="stats">${card("Sales completed", fm(s.gmv_released), "Farmer value of released orders")}${card("Farmer commission", fm(s.platform_fee), "Taken from farmers on delivery")}${card("Buyer markup", fm(s.buyer_margin), "Added to buyer prices, kept by platform")}${card("Plus subscriptions", fm(s.subscription_revenue), "Memberships sold")}<div class="card" style="border:2px solid var(--pr)"><div class="mu">Total platform earnings</div><div class="big">${fm(earn)}</div><div class="mu">Commission + markup + subscriptions</div></div>${card("Farmer price vs mandi forecast", s.avg_farmer_premium_pct == null ? "–" : (s.avg_farmer_premium_pct > 0 ? "+" : "") + s.avg_farmer_premium_pct + "%", "Average over paid-out orders")}</div>
<div class="card tw" style="margin-top:16px"><h2>🔥 High-demand crops</h2><div style="margin-bottom:8px">${dbtn(7, "Last 7 days")} ${dbtn(30, "Last 30 days")} ${dbtn(0, "All time")}</div><table><tr><th>#</th><th>Crop</th><th>Orders</th><th>Kg ordered</th><th>Order value</th><th>In stock now</th><th>Signal</th></tr>${dm.map((d, i) => `<tr><td>${i + 1}</td><td><b>${esc(d.crop)}</b><div style="background:var(--pr);height:6px;border-radius:3px;margin-top:4px;width:${Math.max(4, Math.round(100 * d.kg / top))}%"></div></td><td>${d.n}</td><td>${d.kg.toLocaleString("en-IN")}</td><td>${fm(d.val)}</td><td>${d.stock.toLocaleString("en-IN")} kg</td><td>${i < 3 && d.n >= 2 ? "🔥 High demand" : ""}${d.stock <= 0 ? (i < 3 && d.n >= 2 ? " · " : "") + "<b style=\"color:#b91c1c\">No stock, list more</b>" : ""}</td></tr>`).join("") || '<tr><td colspan="7" class="mu">No orders in this period.</td></tr>'}</table><p class="mu">Ranked by kg ordered. Cancelled and refunded orders are not counted.</p></div>
<div class="card tw"><h2>Latest orders</h2><table><tr><th>#</th><th>When</th><th>Crop</th><th>Buyer → Farmer</th><th>Kg</th><th>Buyer paid</th><th>Status</th></tr>${recent.map(o => `<tr><td>${o.id}</td><td>${esc(when(o.created))}</td><td>${esc(o.crop)}</td><td>${esc(o.buyer)} → ${esc(o.farmer)}</td><td>${o.qty}</td><td>${fm(paid(o))}</td><td>${stTag(o.state)}</td></tr>`).join("") || '<tr><td colspan="7" class="mu">No orders yet.</td></tr>'}</table><button class="b s" onclick="go('orders')">See all orders by day</button></div>
<div class="card tw"><h2>Users <span id="uc" class="mu" style="font-weight:400"></span></h2><div class="row"><div style="flex:2;min-width:220px"><label>Search by name, phone, location or type</label><input id="us" type="search" autocomplete="off" placeholder="e.g. Ramesh, 93800 or Kolar" oninput="userRows()"></div><div><label>Show</label><select id="ur" onchange="userRows()"><option value="">Everyone</option><option value="farmer">Farmers</option><option value="buyer">Buyers</option></select></div></div><table style="margin-top:8px"><tr><th>Name</th><th>Role</th><th>Phone</th><th>Type / plan</th><th>Location</th></tr><tbody id="ub"></tbody></table></div>
<div class="card"><button class="b" onclick="ver()">Verify ledger integrity</button> <span id="vr" class="mu">Ledger intact: ${s.ledger_intact ? "yes" : "NO"}</span></div>`
    };

    const _vo = V.orders;
    V.orders = async () => {
        if (R !== "admin") return _vo();
        const os = await api("/orders?view=admin");
        return `<h2>All orders <span class="mu" style="font-weight:400">· ${os.length} in total, newest first</span></h2>` + groups(os).filter(g => g.k != "Older" || g.r.length).map(g => {
            const n = g.r.length, val = g.r.filter(live).reduce((a, o) => a + paid(o), 0), dis = g.r.filter(o => o.state == "DISPUTED").length;
            return `<h2 style="margin-top:16px">${g.k}${g.s ? ` <span class="mu" style="font-weight:400">(${g.s})</span>` : ""} <span class="mu" style="font-weight:400">· ${n} order${n == 1 ? "" : "s"}${val > 0 ? " · " + fm(val) : ""}${dis ? ` · <b style="color:#b91c1c">${dis} disputed</b>` : ""}</span></h2>` + (g.r.map(admCard).join("") || `<p class="mu">No orders ${g.k == "Today" ? "today" : g.k == "Yesterday" ? "yesterday" : "in this period"}.</p>`)
        }).join("")
    };

    const _at = adminTk;
    adminTk = function (t) {
        const h = _at(t), w = t.created ? ago(t.created) : "", k = '<span class="tag">' + t.status + "</span>";
        return w && h.includes(k) ? h.replace(k, () => k + '<div class="mu">Raised ' + w + "</div>") : h
    };
    liveCard = function (l) {
        const isNew = l.live_at && Date.now() - new Date(l.live_at).getTime() < 48 * 36e5, mk = l.buyer_markup == null ? "default markup" : "markup " + Math.round(l.buyer_markup * 1000) / 10 + "%", eh = +l.early_hours > 0 ? " · Plus early access " + l.early_hours + " h" : "";
        return `<div class="card"><div class="row" style="align-items:center"><div><h3>#${l.id} · ${esc(l.crop)}${l.variety ? " · " + esc(l.variety) : ""}${l.grade ? " · Grade " + esc(l.grade) : ""}${isNew ? ' <span class="tag" style="background:#dcfce7;color:#166534">NEW</span>' : ""}</h3><div class="mu">${esc(l.farmer_name || "")} · ${l.qty} kg left · farmer price ${fk(l.price)}/kg<br>${l.live_at ? "Listed " + ago(l.live_at) + " · " : ""}${mk}${eh}</div></div><div><button class="b s" onclick="unpub(${l.id})">Undo publish</button></div></div></div>`
    };
    V.tickets = async () => {
        const [tk, lv, os] = await Promise.all([api("/tickets?view=admin"), api("/listings?view=admin"), api("/orders?view=admin").catch(() => [])]);
        MR = {}; TK = {}; await Promise.all([...new Set(tk.map(t => t.crop))].map(async c => { try { MR[c] = await api("/mandi/" + encodeURIComponent(c)) } catch (e) { MR[c] = { latest: null } } }));
        const op = tk.filter(t => ["OPEN", "SCHEDULED"].includes(t.status)).sort(byId), dn = tk.filter(t => !["OPEN", "SCHEDULED"].includes(t.status)).sort(byId), lvs = [...lv].sort(byId), hot = demand(os, 30, lv).slice(0, 4);
        return (hot.length ? `<div class="card"><b>🔥 In demand (last 30 days):</b> ${hot.map(d => `${esc(d.crop)} <span class="mu">(${d.n} order${d.n == 1 ? "" : "s"}, ${d.kg.toLocaleString("en-IN")} kg)</span>`).join(" · ")}</div>` : "") + `<h2>Open tickets (${op.length}) <span class="mu" style="font-weight:400">· newest first</span></h2>${op.map(adminTk).join("") || '<p class="mu">No open tickets.</p>'}<h2 style="margin-top:14px">Live listings (${lvs.length}) <span class="mu" style="font-weight:400">· newest first</span></h2>${lvs.map(liveCard).join("") || '<p class="mu">No live listings.</p>'}<h2 style="margin-top:14px">Closed</h2>${dn.map(tkCard).join("") || "—"}`
    }
})();
</script>
