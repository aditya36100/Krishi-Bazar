<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Krishi Bazar · B2B Agri Marketplace & Escrow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-heading: 'Outfit', 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            --bg: #f8fafc;
            --card: #ffffff;
            --card-glass: rgba(255, 255, 255, 0.88);
            --tx: #0f172a;
            --mu: #64748b;
            --bd: #e2e8f0;
            --bd-subtle: #f1f5f9;
            --wr: #d97706;

            /* Base role tokens - default Farmer */
            --pr: #059669;
            --pr-dark: #047857;
            --pr2: #ecfdf5;
            --g1: #059669;
            --g2: #10b981;
            --pr-glow: rgba(16, 185, 129, 0.22);
            --sh: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
            --sh2: 0 16px 36px -4px rgba(15, 23, 42, 0.12), 0 6px 14px -2px rgba(15, 23, 42, 0.06);
        }

        body[data-role=farmer] {
            --pr: #059669;
            --pr-dark: #047857;
            --pr2: #ecfdf5;
            --g1: #059669;
            --g2: #10b981;
            --pr-glow: rgba(16, 185, 129, 0.25);
        }

        body[data-role=buyer] {
            --pr: #0284c7;
            --pr-dark: #0369a1;
            --pr2: #f0f9ff;
            --g1: #0284c7;
            --g2: #0ea5e9;
            --pr-glow: rgba(2, 132, 199, 0.25);
        }

        body[data-role=admin] {
            --pr: #4f46e5;
            --pr-dark: #4338ca;
            --pr2: #eef2ff;
            --g1: #4f46e5;
            --g2: #7c3aed;
            --pr-glow: rgba(79, 70, 229, 0.25);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #090d16;
                --card: #111827;
                --card-glass: rgba(17, 24, 39, 0.88);
                --tx: #f8fafc;
                --mu: #94a3b8;
                --bd: #1e293b;
                --bd-subtle: #141e33;
                --wr: #fbbf24;
                --sh: 0 4px 24px -2px rgba(0, 0, 0, 0.45);
                --sh2: 0 16px 40px -4px rgba(0, 0, 0, 0.65);
            }
            body[data-role=farmer] { --pr: #34d399; --pr2: #064e3b; --pr-dark: #10b981; }
            body[data-role=buyer] { --pr: #38bdf8; --pr2: #082f49; --pr-dark: #0284c7; }
            body[data-role=admin] { --pr: #818cf8; --pr2: #1e1b4b; --pr-dark: #4f46e5; }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: radial-gradient(1100px 520px at 12% -8%, color-mix(in srgb, var(--g1) 12%, transparent), transparent 70%),
                        radial-gradient(900px 480px at 95% -5%, color-mix(in srgb, var(--g2) 10%, transparent), transparent 65%),
                        var(--bg);
            background-attachment: fixed;
            color: var(--tx);
            font: 14px/1.55 var(--font-sans);
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Top Brand Header */
        /* Top Brand Header - Compact 52px */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: color-mix(in srgb, var(--card) 90%, transparent);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--bd);
            padding: 0 20px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            box-shadow: 0 2px 10px -2px rgba(0, 0, 0, 0.04);
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--g1), var(--g2));
            display: grid;
            place-items: center;
            font-size: 16px;
            box-shadow: 0 2px 8px var(--pr-glow);
            color: #fff;
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-family: var(--font-heading);
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0;
            line-height: 1.1;
            color: var(--tx);
        }

        .brand-sub {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--pr);
            display: block;
        }

        /* Nav Integrated inside Header */
        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 0 8px;
            background: transparent;
            border: none;
            position: static;
            flex: 1;
            overflow-x: auto;
        }

        nav button {
            border: 1px solid transparent;
            background: transparent;
            color: var(--mu);
            padding: 5px 12px;
            border-radius: 9999px;
            font-size: 12.5px;
            font-weight: 600;
            font-family: var(--font-sans);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 30px;
        }

        nav button:hover {
            color: var(--tx);
            background: var(--pr2);
        }

        nav button.on {
            background: var(--pr2);
            color: var(--pr);
            border-color: color-mix(in srgb, var(--pr) 25%, transparent);
            font-weight: 700;
            box-shadow: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            flex-shrink: 0;
        }

        /* Segmented Role Switcher */
        .role-switcher {
            display: flex;
            background: var(--bd-subtle);
            padding: 2px;
            border-radius: 9999px;
            border: 1px solid var(--bd);
            gap: 2px;
            height: 32px;
            box-sizing: border-box;
            align-items: center;
        }

        .role-btn {
            border: 0;
            background: transparent;
            color: var(--mu);
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            height: 26px;
        }

        .role-btn:hover {
            color: var(--tx);
        }

        .role-btn.active {
            background: var(--card);
            color: var(--pr);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            font-weight: 700;
        }

        .pill-select {
            border-radius: 9999px;
            border: 1px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            padding: 4px 8px 4px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            height: 32px;
            width: auto;
            max-width: 100px;
            flex-shrink: 0;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .pill-select:focus {
            border-color: var(--pr);
            box-shadow: 0 0 0 3px var(--pr-glow);
        }

        .header-actions .b.s {
            margin: 0;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 700;
            height: 32px;
            border-radius: 9999px;
            flex-shrink: 0;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
        }

        /* Status Badge / Mandi Pulse - Slim notification ticker */
        #badge {
            padding: 4px 16px;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.25;
            background: color-mix(in srgb, var(--pr2) 75%, var(--card));
            color: var(--pr);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-bottom: 1px solid var(--bd);
            letter-spacing: 0.01em;
            transition: background 0.2s;
            min-height: 22px;
        }

        #badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
            animation: pulseDot 2s infinite;
            flex-shrink: 0;
        }

        #badge.w {
            background: color-mix(in srgb, var(--wr) 15%, var(--card));
            color: var(--wr);
        }

        #badge.w::before {
            background: var(--wr);
            box-shadow: 0 0 6px var(--wr);
        }

        /* Main App Container */
        main {
            max-width: 1140px;
            margin: 0 auto;
            padding: 24px 20px 80px;
        }

        /* Modern Executive Hero Header */
        .hero {
            position: relative;
            border-radius: 20px;
            padding: 18px 24px;
            margin-bottom: 22px;
            background: var(--card);
            border: 1px solid var(--bd);
            border-top: 3px solid var(--pr);
            box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .hero-left {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 260px;
            flex: 1;
        }

        .hero .ic {
            font-size: 24px;
            background: var(--pr2);
            border: 1px solid color-mix(in srgb, var(--pr) 25%, transparent);
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px color-mix(in srgb, var(--pr) 15%, transparent);
        }

        .hero-text {
            flex: 1;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--pr);
            margin-bottom: 3px;
        }

        .hero-tag-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--pr);
            box-shadow: 0 0 6px var(--pr);
            animation: pulseDot 2s infinite;
        }

        .hero h1 {
            font-family: var(--font-heading);
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0;
            color: var(--tx);
            line-height: 1.25;
        }

        .hero p {
            margin: 3px 0 0;
            color: var(--mu);
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            max-width: 620px;
        }

        .hero-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .hero .chip {
            background: var(--bg);
            border: 1px solid var(--bd);
            color: var(--tx);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .hero-actions {
            display: flex;
            gap: 8px;
        }

        .hero-actions .b.s {
            margin: 0;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 700;
        }

        /* Cards */
        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: var(--sh);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s, border-color 0.2s;
        }

        .grid > .card:hover, .stats > .card[onclick]:hover {
            transform: translateY(-3px);
            box-shadow: var(--sh2);
            border-color: color-mix(in srgb, var(--pr) 50%, var(--bd));
        }

        /* Stats & KPI Grid */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .stats > .card {
            position: relative;
            overflow: hidden;
            padding: 22px 20px;
            margin-bottom: 0;
            border-radius: 18px;
        }

        .stats > .card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--g1), var(--g2));
        }

        .stats > .card:nth-child(4n+2)::before { background: linear-gradient(90deg, #f59e0b, #f97316); }
        .stats > .card:nth-child(4n+3)::before { background: linear-gradient(90deg, #06b6d4, #3b82f6); }
        .stats > .card:nth-child(4n+4)::before { background: linear-gradient(90deg, #8b5cf6, #ec4899); }

        .big {
            font-family: var(--font-heading);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--tx);
            line-height: 1.15;
            margin: 6px 0 4px;
        }

        .stats .big {
            background: linear-gradient(135deg, var(--tx), color-mix(in srgb, var(--tx) 65%, var(--g1)));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Typography & Headings */
        h2 {
            font-family: var(--font-heading);
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 14px;
            color: var(--tx);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h3 {
            font-family: var(--font-heading);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0 0 6px;
            color: var(--tx);
        }

        .mu {
            color: var(--mu);
            font-size: 13px;
            line-height: 1.5;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 16px;
        }

        /* Buttons */
        .b {
            background: linear-gradient(135deg, var(--g1), var(--g2));
            color: #ffffff;
            border: 0;
            border-radius: 9999px;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 700;
            font-family: var(--font-sans);
            cursor: pointer;
            box-shadow: 0 4px 14px var(--pr-glow);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 10px 6px 0 0;
            text-decoration: none;
        }

        .b:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--pr-glow);
        }

        .b:active {
            transform: translateY(0);
        }

        .b.s {
            background: var(--pr2);
            color: var(--pr);
            box-shadow: none;
            border: 1px solid color-mix(in srgb, var(--pr) 25%, transparent);
        }

        .b.s:hover {
            background: color-mix(in srgb, var(--pr) 18%, var(--pr2));
            transform: translateY(-1px);
        }

        .b:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Tags & Badges */
        .tag {
            background: var(--pr2);
            color: var(--pr);
            border-radius: 9999px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid color-mix(in srgb, var(--pr) 20%, transparent);
        }

        .tag-new {
            background: linear-gradient(135deg, #f59e0b, #ef4444) !important;
            color: #ffffff !important;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.35);
            border: 0 !important;
            animation: pulseGlow 2.5s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 2px 8px rgba(239, 68, 68, 0.35); }
            50% { box-shadow: 0 2px 14px rgba(245, 158, 11, 0.6); }
        }

        .up {
            color: var(--pr);
            font-weight: 700;
        }

        /* Form Controls */
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--mu);
            margin: 12px 0 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--bd);
            border-radius: 12px;
            background: var(--card);
            color: var(--tx);
            font-size: 14px;
            font-family: var(--font-sans);
            transition: all 0.15s ease;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--pr);
            box-shadow: 0 0 0 3px var(--pr-glow);
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .row > * {
            flex: 1;
            min-width: 140px;
        }

        /* Tables */
        .tw {
            overflow-x: auto;
            border: 1px solid var(--bd);
            border-radius: 16px;
            background: var(--card);
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            min-width: 580px;
        }

        th {
            background: var(--bd-subtle);
            color: var(--mu);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 12px 14px;
            border-bottom: 1px solid var(--bd);
            text-align: left;
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--bd-subtle);
            font-size: 13px;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        tbody tr:hover td {
            background: color-mix(in srgb, var(--pr2) 40%, transparent);
        }

        /* Steps Timeline */
        .steps {
            display: flex;
            gap: 6px;
            margin: 12px 0 10px;
        }

        .steps i {
            flex: 1;
            height: 6px;
            border-radius: 9999px;
            background: var(--bd);
            transition: all 0.3s ease;
        }

        .steps i.d {
            background: linear-gradient(90deg, var(--g1), var(--g2));
            box-shadow: 0 0 8px var(--pr-glow);
        }

        /* Plan / Membership Styling */
        .pl {
            background: linear-gradient(135deg, #091e2b 0%, #0e374d 50%, #0d9488 100%);
            color: #ffffff;
            border-radius: 22px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: var(--sh2);
        }

        .pl h1 { margin: 0 0 8px; font-size: 28px; font-family: var(--font-heading); font-weight: 800; }
        .pl p { margin: 0; opacity: 0.9; font-size: 15px; }

        .lg2 {
            display: inline-block;
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 9999px;
            padding: 3px 12px;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        .bn {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .bn > div {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 16px;
            padding: 14px;
        }

        .bn > div > span { font-size: 24px; }
        .bn b { display: block; font-size: 14px; font-weight: 700; margin-bottom: 2px; }

        .pc {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin: 16px 0;
        }

        .pp {
            position: relative;
            background: var(--card);
            border: 2px solid var(--bd);
            border-radius: 18px;
            padding: 24px 18px 18px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pp:hover {
            border-color: var(--pr);
            transform: translateY(-2px);
        }

        .pp.on {
            border-color: var(--pr);
            box-shadow: 0 0 0 4px var(--pr-glow);
        }

        .pp .rd {
            position: absolute;
            right: 16px;
            top: 20px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--bd);
        }

        .pp.on .rd {
            border: 6px solid var(--pr);
        }

        .pp .tg {
            position: absolute;
            left: 16px;
            top: -12px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.05em;
            padding: 3px 12px;
            border-radius: 9999px;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.35);
        }

        .pp .pr {
            font-family: var(--font-heading);
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 8px 0;
        }

        .pp .pr small { font-size: 14px; font-weight: 500; color: var(--mu); }

        .sv {
            display: inline-block;
            background: var(--pr2);
            color: var(--pr);
            border-radius: 8px;
            padding: 3px 10px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 8px;
        }

        .ck {

    <script>

        let TOKEN = ""; try { TOKEN = sessionStorage.getItem("ks_token") || "" } catch (e) { }

        const opt = (a, s) => a.map(x => `<option ${x == s ? "selected" : ""}>${x}</option>`).join("");
        function ordCard(o) {

            return `<div class="card"><div class="row" style="align-items:center"><div><h3>#${o.id} · ${escH(o.crop)} · ${o.qty} kg</h3><div class="mu">${escH(o.buyer)} → ${escH(o.farmer)}</div></div><div><b>${fm(o.amount)}</b> <span class="tag">${o.state}</span>${o.payout != null ? `<div class="mu">You receive ${fm(o.payout)} after commission</div>` : ""}</div></div>
<div class="steps">${ST.map((_, j) => `<i class="${j <= i && !bad ? "d" : ""}"></i>`).join("")}</div>${btns(o)}<button class="b s" onclick="led(${o.id})">Audit ledger</button><div id="lg${o.id}" class="lg"></div></div>`
        }
        const PERM = { farmer: ["harvest", "ship", "cancel", "refund", "dispute"], buyer: ["fund", "cancel", "deliver", "release", "dispute"], admin: ["release", "refund"] };
        const UNDOR = { HARVESTED: "farmer", SHIPPED: "farmer", DELIVERED: "buyer" };
        function btns(o) {
            let a = (NX[o.state] || []).filter(x => PERM[R].includes(x) && (o.state == "DISPUTED" ? R == "admin" : R != "admin"));
            if (R == "buyer") { a = a.filter(x => x != "cancel"); if (["PLACED", "FUNDED"].includes(o.state)) a.push("buyer_cancel") }
            if (UNDOR[o.state] == R) a.push("undo");

            if (R == "admin" && o.state == "DISPUTED") h += `<button class="b s" onclick="fault(${o.id},${o.farmer_id})">Fault: farmer</button><button class="b s" onclick="fault(${o.id},${o.buyer_id})">Fault: buyer</button>`;
            return h

        async function fault(id, p) { try { await api(`/orders/${id}/fault/${p}`, "POST"); toast("Fault recorded on that party's trust score") } catch (e) { toast(e.message) } }

        async function led(id) { const r = await api(`/orders/${id}/ledger?view=${R}`); $("#lg" + id).innerHTML = r.map(e => `${e.event} · ${e.ts.slice(0, 19)} · hash ${e.hash.slice(0, 10)} ← prev ${e.prev_hash.slice(0, 10)}`).join("<br>") }
        let MR = {}, TK = {}, LST = {};
        const BT = ["Restaurant", "Hotel", "Supermarket", "Exporter", "Personal use", "Other"];
        function tkCard(t) { const s = t.status; return `<div class="card"><div class="row" style="align-items:center"><div><h3>#${t.id} · ${escH(t.crop)} · ${escH(t.variety)}</h3><div class="mu">${escH(t.farmer) ? escH(t.farmer) + " · " : ""}${t.qty} kg${escH(t.notes) ? " · " + escH(t.notes) : ""}</div></div><div><span class="tag">${s}</span></div></div>${mediaLine(t)}${s == "SCHEDULED" ? `<div class="mu">Our team will visit on ${t.visit_date}.</div>` : ""}${s == "APPROVED" ? `<div class="mu">Grade ${t.grade} · verified ${t.final_qty} kg · price agreed ${fk(t.price)}/kg${t.mandi_ref ? " · mandi that week " + fk(t.mandi_ref) : ""}. Your listing is live.</div>` : ""}${s == "REJECTED" || s == "UNPUBLISHED" ? `<div class="mu">Reason: ${escH(t.reason) || "not given"}</div>` : ""}${s == "APPROVED" && R == "admin" && t.listing_id ? `<button class="b s" onclick="unpub(${t.listing_id})">Undo publish</button>` : ""}${["OPEN", "SCHEDULED"].includes(s) && R == "farmer" ? `<button class="b s" onclick="cancelTk(${t.id})">Cancel ticket</button>` : ""}</div>` }
        function liveCard(l) { return `<div class="card"><div class="row" style="align-items:center"><div><h3>#${l.id} · ${escH(l.crop)}${escH(l.variety) ? " · " + escH(l.variety) : ""}${l.grade ? " · Grade " + l.grade : ""}</h3><div class="mu">${escH(l.farmer_name) || ""} · ${l.qty} kg left · farmer price ${fk(l.price)}/kg</div></div><div><button class="b s" onclick="unpub(${l.id})">Undo publish</button></div></div></div>` }

${md.filter(x => x.kind == "video").map(x => `<video controls preload="metadata" style="width:100%;max-width:340px;border-radius:8px;margin-top:8px" src="/media/${x.id}?t=${TOKEN}"></video><div class="mu"><a href="/media/${x.id}?t=${TOKEN}" target="_blank">Open video in a new tab</a></div>`).join("")}
<div>${md.filter(x => x.kind == "photo").map(x => `<a href="/media/${x.id}?t=${TOKEN}" target="_blank"><img loading="lazy" src="/media/${x.id}?t=${TOKEN}" style="width:84px;height:84px;object-fit:cover;border-radius:8px;margin:6px 6px 0 0"></a>`).join("")}</div>
<div class="mu" style="margin-top:6px">${m.latest != null ? `Current mandi ${fk(m.latest)}/kg (week of ${m.as_of}). Suggested farmer price: A ${fk(m.suggest.A)} · B ${fk(m.suggest.B)} · C ${fk(m.suggest.C)}` : "No mandi price found for this crop. Enter the price manually."}</div>
<div class="row"><div><label>Visit date</label><input id="vd${id}" type="date" value="${t.visit_date || t.pref_date || ""}"></div><div><label>Grade</label><select id="gr${id}" onchange="gsel(${id})"><option>A</option><option selected>B</option><option>C</option></select></div><div><label>Verified qty (kg)</label><input id="vq${id}" type="number" value="${t.qty}"></div><div><label>Farmer price ₹/kg</label><input id="vp${id}" type="number" step="0.1" value="${m.latest != null ? m.suggest.B : ""}"></div></div>

            if (i < 3 && d.n >= 2) sig += `<span class="tag" style="background:#fef3c7;color:#92400e;border:1px solid #fde68a">🔥 High Demand</span>`;
            if (d.stock <= 0) sig += `${sig ? ' ' : ''}<span class="tag" style="background:#fee2e2;color:#991b1b;border:1px solid #fecaca">⚠️ Out of Stock</span>`;
            return `<tr>
                <td style="font-weight:700;font-size:15px">${medals[i] || "#" + (i + 1)}</td>
                <td>
                    <b>${esc(d.crop)}</b>
                    <div style="background:linear-gradient(90deg, #3b82f6, #06b6d4);height:6px;border-radius:3px;margin-top:4px;width:${Math.max(4, Math.round(100 * d.kg / top))}%"></div>
                </td>
                <td><b>${d.n}</b></td>
                <td>${d.kg.toLocaleString("en-IN")} kg</td>
                <td>${fm(d.val)}</td>
                <td>${d.stock.toLocaleString("en-IN")} kg</td>
                <td>${sig || '<span class="mu" style="font-size:12px">Normal</span>'}</td>
            </tr>`;
        }).join("") || '<tr><td colspan="7" class="mu" style="text-align:center;padding:24px">No orders recorded in this period.</td></tr>'}
    </table>
    <p class="mu" style="font-size:12px;margin:8px 0 0">Ranked by volume ordered. Cancelled and refunded orders are excluded.</p>
</div>

<div class="card tw">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px">
        <h2 style="margin:0">📦 Recent Orders</h2>
        <button class="b s" style="margin:0" onclick="go('orders')">See all orders by day →</button>
    </div>
    <table>
        <tr><th>Order ID</th><th>Placed</th><th>Crop</th><th>Buyer → Farmer</th><th>Qty</th><th>Buyer Paid</th><th>Status</th></tr>
        ${recent.map(o => `<tr>
            <td><code style="font-weight:700">#${o.id}</code></td>
            <td>${esc(when(o.created))}</td>
            <td><b>${esc(o.crop)}</b></td>
            <td>${esc(o.buyer)} → ${esc(o.farmer)}</td>
            <td>${o.qty} kg</td>
            <td><b>${fm(paid(o))}</b></td>
            <td>${stTag(o.state)}</td>
        </tr>`).join("") || '<tr><td colspan="7" class="mu" style="text-align:center;padding:24px">No orders placed yet.</td></tr>'}
    </table>
</div>

<div class="card tw">
    <h2>👥 User Management <span id="uc" class="mu" style="font-weight:400"></span></h2>
    <div class="row" style="margin-bottom:12px">
        <div style="flex:2;min-width:220px">
            <label>Search by name, phone, location or type</label>
            <input id="us" type="search" autocomplete="off" placeholder="e.g. Ramesh, 93800 or Kolar" oninput="userRows()">
        </div>
        <div>
            <label>Filter role</label>
            <select id="ur" onchange="userRows()">
                <option value="">All Roles</option>
                <option value="farmer">Farmers only</option>
                <option value="buyer">Buyers only</option>
            </select>
        </div>
    </div>
    <table>
        <tr><th>Name</th><th>Role</th><th>Phone</th><th>Type / Plan</th><th>Location</th></tr>
        <tbody id="ub"></tbody>
    </table>
</div>

<div class="card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px">
    <div>
        <h3 style="margin:0 0 4px">🛡️ Cryptographic Ledger Integrity</h3>
        <div id="vr" class="mu">${s.ledger_intact ? "✔ All SHA-256 order audit hashes intact &amp; verified" : "⚠️ WARNING: Ledger tampering detected"}</div>
    </div>
    <button class="b s" style="margin:0" onclick="ver()">Run Full Integrity Check</button>
</div>`;
    };

    const _vo = V.orders;
    V.orders = async () => {
        if (R !== "admin") return _vo();
        const os = await api("/orders?view=admin");
        return `<h2>All orders <span class="mu" style="font-weight:400">· ${os.length} in total, newest first</span></h2>` + groups(os).filter(g => g.k != "Older" || g.r.length).map(g => {
            const n = g.r.length, val = g.r.filter(live).reduce((a, o) => a + paid(o), 0), dis = g.r.filter(o => o.state == "DISPUTED").length;
            return `<h2 style="margin-top:16px">${g.k}${g.s ? ` <span class="mu" style="font-weight:400">(${g.s})</span>` : ""} <span class="mu" style="font-weight:400">· ${n} order${n == 1 ? "" : "s"}${val > 0 ? " · " + fm(val) : ""}${dis ? ` · <b style="color:#b91c1c">${dis} disputed</b>` : ""}</span></h2>` + (g.r.map(admCard).join("") || `<p class="mu">No orders ${g.k == "Today" ? "today" : g.k == "Yesterday" ? "yesterday" : "in this period"}.</p>`)
        }).join("")
    };

    const _at = adminTk;
    adminTk = function (t) {
        const h = _at(t), w = t.created ? ago(t.created) : "", k = '<span class="tag">' + t.status + "</span>";
        return w && h.includes(k) ? h.replace(k, () => k + '<div class="mu">Raised ' + w + "</div>") : h
    };
    liveCard = function (l) {
        const isNew = l.live_at && Date.now() - new Date(l.live_at).getTime() < 48 * 36e5, mk = l.buyer_markup == null ? "default markup" : "markup " + Math.round(l.buyer_markup * 1000) / 10 + "%", eh = +l.early_hours > 0 ? " · Plus early access " + l.early_hours + " h" : "";
        return `<div class="card"><div class="row" style="align-items:center"><div><h3>#${l.id} · ${esc(l.crop)}${l.variety ? " · " + esc(l.variety) : ""}${l.grade ? " · Grade " + esc(l.grade) : ""}${isNew ? ' <span class="tag" style="background:#dcfce7;color:#166534">NEW</span>' : ""}</h3><div class="mu">${esc(l.farmer_name || "")} · ${l.qty} kg left · farmer price ${fk(l.price)}/kg<br>${l.live_at ? "Listed " + ago(l.live_at) + " · " : ""}${mk}${eh}</div></div><div><button class="b s" onclick="unpub(${l.id})">Undo publish</button></div></div></div>`
    };
    V.tickets = async () => {
        const [tk, lv, os] = await Promise.all([api("/tickets?view=admin"), api("/listings?view=admin"), api("/orders?view=admin").catch(() => [])]);
        MR = {}; TK = {}; await Promise.all([...new Set(tk.map(t => t.crop))].map(async c => { try { MR[c] = await api("/mandi/" + encodeURIComponent(c)) } catch (e) { MR[c] = { latest: null } } }));
        const op = tk.filter(t => ["OPEN", "SCHEDULED"].includes(t.status)).sort(byId), dn = tk.filter(t => !["OPEN", "SCHEDULED"].includes(t.status)).sort(byId), lvs = [...lv].sort(byId), hot = demand(os, 30, lv).slice(0, 4);
        return (hot.length ? `<div class="card"><b>🔥 In demand (last 30 days):</b> ${hot.map(d => `${esc(d.crop)} <span class="mu">(${d.n} order${d.n == 1 ? "" : "s"}, ${d.kg.toLocaleString("en-IN")} kg)</span>`).join(" · ")}</div>` : "") + `<h2>Open tickets (${op.length}) <span class="mu" style="font-weight:400">· newest first</span></h2>${op.map(adminTk).join("") || '<p class="mu">No open tickets.</p>'}<h2 style="margin-top:14px">Live listings (${lvs.length}) <span class="mu" style="font-weight:400">· newest first</span></h2>${lvs.map(liveCard).join("") || '<p class="mu">No live listings.</p>'}<h2 style="margin-top:14px">Closed</h2>${dn.map(tkCard).join("") || "—"}`
    }
})();
</script>

function deco(x) {
    document.body.dataset.role = R; const a = $("#app");
    if (!a || a.querySelector(".hero") || !TABS[R] || x !== TABS[R][0]) return;
    const h = HERO[R] || HERO.farmer, d = new Date().toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
    const acts = (h.actions || []).map(act => `<button class="b s" onclick="go('${act.to}')">${act.label}</button>`).join("");
    a.insertAdjacentHTML("afterbegin", `
        <div class="hero">

            <div class="hero-right">
                <span class="chip">📅 ${d}</span>
                <div class="hero-actions">${acts}</div>
            </div>
        </div>
    `);
}
const _go = go; go = async function (x) { document.body.dataset.role = R; await _go(x); deco(x) };
document.body.dataset.role = R;
})();
</script>
